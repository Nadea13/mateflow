services:
  # 1. Local PostgreSQL Database with Mateflow Schema
  postgres:
    image: postgres:16-alpine
    container_name: mateflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mateflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Database GUI Tool (Adminer / Studio)
  adminer:
    image: adminer:latest
    container_name: mateflow-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
